[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systems-for-construction"
version = "0.1.0a5"
description = "Open infrastructure for construction intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Systems for Construction contributors" }]
keywords = ["construction", "engineering", "bim", "evidence", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# SFC Core is stdlib-only by ADR 0001. These are for the conformance gate and
# the test runner, and are never imported by the runtime.
dev = [
  "coverage>=7.4",
  "jsonschema>=4.20",
  "pytest>=8",
]

[project.scripts]
sfc = "sfc.cli:main"
sfc-mcp = "sfc.mcp:main"

[tool.setuptools]
package-dir = {"" = "packages/sfc-core/src"}

[tool.setuptools.package-data]
sfc = ["vocabularies/*.json"]

[tool.setuptools.packages.find]
where = ["packages/sfc-core/src"]

[tool.coverage.run]
# Branch coverage, because the subject is which way a decision went. A line
# floor would miss exactly what is worth measuring.
branch = true
source = ["packages/sfc-core/src/sfc"]
# The reference gateway spawns no subprocesses; measuring only the test process
# keeps the number reproducible across machines.
parallel = false

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
# The floors live in tools/coverage_gate.py, which holds the kernel modules to
# a higher one than the runtime as a whole.
fail_under = 0

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import sfc directly, so pytest must find the package whether or not
# it has been installed. Without this, a clean clone fails collection with
# "No module named 'sfc'" while unittest after pip install -e . succeeds.
pythonpath = ["packages/sfc-core/src"]
